# Configuração usada pela Cloudflare ao publicar a partir do GitHub.
name = "cobranca-colegioser"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Telas do painel (HTML, CSS, JS). O /api/ é sempre atendido pelo src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Banco de dados. Troque o database_id pelo ID do banco "cobranca-ser"
# (Cloudflare > Storage & Databases > D1 > cobranca-ser > copie o "Database ID").
[[d1_databases]]
binding = "DB"
database_name = "cobranca-ser"
database_id = "ccdf2c54-20f5-4daf-92a2-8c40f6e429b8"

[observability]
enabled = true
